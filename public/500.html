<!doctype html>
<html lang="pt-BR">
  <head>
    <title>Erro no servidor · Harpia</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/harpia-logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,700|Work+Sans:400,700&display=swap" rel="stylesheet">

    <!-- Página estática (servida sem passar pelo app): o CSS fica todo aqui -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #F4F6F9;
        color: #0A1128;
        font-family: "Work Sans", Helvetica, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      header { background: #0A1128; padding: 12px 16px; }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #fff;
        text-decoration: none;
        font-family: Nunito, Helvetica, sans-serif;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .brand img { height: 40px; width: auto; }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 16px;
      }

      .card {
        width: 100%;
        max-width: 560px;
        background: #fff;
        border-radius: 24px;
        box-shadow: 0 4px 24px rgba(10, 17, 40, 0.08);
        padding: 48px 32px;
        text-align: center;
      }

      .code {
        font-family: Nunito, Helvetica, sans-serif;
        font-size: 5rem;
        font-weight: 700;
        line-height: 1;
        color: #F08A5D;
      }

      h1 {
        font-family: Nunito, Helvetica, sans-serif;
        font-size: 1.5rem;
        margin: 16px 0 8px;
      }

      p { color: #5b6275; }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 32px;
      }

      .btn {
        display: inline-block;
        padding: 10px 24px;
        border-radius: 999px;
        text-decoration: none;
        border: 1px solid transparent;
        background: none;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-primary { background: #F08A5D; color: #fff; }
      .btn-primary:hover, .btn-primary:focus-visible { background: #e2733f; }
      .btn-outline { border-color: rgba(10, 17, 40, 0.3); color: #0A1128; }
      .btn-outline:hover, .btn-outline:focus-visible { border-color: #0A1128; }

      @media (max-width: 480px) {
        .card { padding: 40px 20px; }
        .code { font-size: 4rem; }
      }
    </style>
  </head>

  <body>
    <header>
      <a class="brand" href="/">
        <img src="/harpia-logo.png" alt="" width="36" height="40">
        <span>HarpIA</span>
      </a>
    </header>

    <main>
      <div class="card">
        <div class="code" aria-hidden="true">500</div>
        <h1>Algo deu errado do nosso lado</h1>
        <p>Tivemos um problema ao carregar esta página. Não é nada que você tenha feito: tente de novo em alguns minutos.</p>

        <div class="actions">
          <button type="button" class="btn btn-primary" onclick="location.reload()">Tentar de novo</button>
          <a class="btn btn-outline" href="/">Ir para o início</a>
        </div>
      </div>
    </main>
  </body>
</html>
